name: CI - Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd ml-price-prediction/backend
          pip install -r requirements.txt

      - name: Build Backend Docker Image
        run: docker build -t gieldomat-backend ./ml-price-prediction/backend

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t gieldomat-frontend ./ml-price-prediction/frontend

  docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker-compose up --build -d
        working-directory: ml-price-prediction

      - name: Wait for services to start
        run: sleep 15

      - name: Check backend is running
        run: curl --fail http://localhost:8000/docs || exit 1

      - name: Check frontend is running
        run: curl --fail http://localhost:80 || exit 1

      - name: Show running containers
        run: docker ps

      - name: Stop services
        run: docker-compose down
        working-directory: ml-price-prediction
